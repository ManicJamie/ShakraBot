[project]
name = "shakra"
version = "0.1.0"
description = "The modular discord bot used by the Hollow Knight Speedrun & Racing Community"
readme = "README.md"
authors = [{ name = "Jamie", email = "jamie@manicjamie.com" }]
requires-python = ">=3.15.0"
dependencies = [
    "discord.py~=2.7.1",
    "speedruncompy>=1.1.1",
    "pytimeparse>=1.1.10",
    "tortoise-orm[accel]>=1.1.9",
    "pydantic>=2.14.4",
    "orjson>=3.13.0",
]

[project.optional-dependencies]
voice = [
    "discord.py[voice]~=2.7.1",
    "davey>=0.2.0",
]
twitch = [
    "twitchAPI>=4.5.0"
]

[project.scripts]
shakra = "shakra:main"

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[tool.tortoise]
tortoise_orm = "shakra.TORT_CONFIG"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["EXE002"]
exclude = ["migrations"]

[tool.ruff.format]
exclude = ["migrations"]